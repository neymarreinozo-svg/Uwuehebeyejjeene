# 
name: APK Builder - Automatic ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -type f -name "*.zip" \
            -not -path "*/.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP found."
            echo "Upload your project ZIP to the repository."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/android_project"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/android_project"

          echo "ZIP extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$RUNNER_TEMP/android_project" \
            -type f -name "gradlew" -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "The ZIP may not contain a valid Android Gradle project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project located at:"
          echo "$PROJECT_DIR"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/app-debug.apk"

          echo "APK successfully generated:"
          ls -lh "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30
